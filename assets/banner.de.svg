<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc"><title id="title">MQTT Entity Share</title><desc id="desc">Zwei Home-Assistant-Instanzen teilen gezielt Entitäten über MQTT. Auswahl über Liste, Labels oder Hybrid.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c172d"/><stop offset="1" stop-color="#142c48"/></linearGradient><linearGradient id="accent"><stop stop-color="#4ce0cf"/><stop offset="1" stop-color="#56b9ff"/></linearGradient></defs><rect width="1200" height="490" rx="24" fill="url(#bg)"/><circle cx="1110" cy="50" r="230" fill="#1e4d69" opacity=".25"/><circle cx="-40" cy="490" r="240" fill="#1f5970" opacity=".15"/><g font-family="DejaVu Sans,Arial,sans-serif"><g transform="translate(54 43)" stroke="#54dece" stroke-width="4" fill="#0c172d"><path d="M12 20 42 5M12 20l30 20"/><circle cx="9" cy="20" r="7"/><circle cx="45" cy="4" r="7"/><circle cx="45" cy="40" r="7"/></g><text x="126" y="72" font-size="25" fill="#f3f8ff" font-weight="bold">MQTT Entity Share</text><text x="1146" y="66" text-anchor="end" font-size="12" letter-spacing="2" fill="#a8c4db">MADE FOR HOME ASSISTANT</text><text x="54" y="156" font-size="49" font-weight="bold" fill="#fff">Dein Zuhause. Deine Freigaben.</text><text x="56" y="199" font-size="21" fill="#bdd0e4">Verbinde zwei Instanzen – und teile genau das, was du möchtest.</text><rect x="54" y="258" width="300" height="148" rx="18" fill="#172f49" stroke="#36516c"/><g transform="translate(79 286)" fill="none" stroke="#65dcd5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M0 24 24 4 48 24M8 20v34h32V20M20 54V36h10v18"/></g><text x="148" y="309" font-size="24" font-weight="bold" fill="#fff">Zuhause A</text><text x="79" y="374" font-size="17" fill="#bdd0e4">Du wählst, was A teilt.</text><rect x="846" y="258" width="300" height="148" rx="18" fill="#172f49" stroke="#36516c"/><g transform="translate(871 286)" fill="none" 