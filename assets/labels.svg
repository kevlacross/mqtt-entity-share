<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc"><title id="title">One label, clear permissions</title><desc id="desc">MQTT-Share read shares states. MQTT-Share control additionally allows control. Nothing is shared without permission.</desc><rect width="1200" height="340" rx="22" fill="#f3f7fc"/><g font-family="DejaVu Sans,Arial,sans-serif"><text x="42" y="56" font-size="28" font-weight="bold" fill="#112b44">One label. Clear permissions.</text><text x="42" y="88" font-size="16" fill="#536a80">In label mode, assign permissions directly to devices or entities.</text><rect x="42" y="121" width="356" height="169" rx="16" fill="#fff" stroke="#d9e3ef"/><rect x="62" y="142" width="316" height="38" rx="10" fill="#0b8f89"/><text x="220" y="167" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">MQTT-Share read</text><text x="64" y="219" font-size="22" font-weight="bold" fill="#112b44">See states</text><text x="64" y="255" font-size="16" fill="#536a80">Read-only</text><rect x="422" y="121" width="356" height="169" rx="16" fill="#fff" stroke="#d9e3ef"/><rect x="442" y="142" width="316" height="38" rx="10" fill="#2770ba"/><text x="600" y="167" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">MQTT-Share control</text><text x="444" y="219" font-size="22" font-weight="bold" fill="#112b44">Allow control</text><text x="444" y="255" font-size="16" fill="#536a80">Read + control</text><rect x="802" y="121" width="356" height="169" rx="16" fill="#fff" stroke="#d9e3ef"/><rect x="822" y="142" width="316" height="38" rx="10" fill="#66758b"/><text x="980" y="167" text-anchor="middle" font-size="17" font-weight="bold" fill="#fff">No permission</text><text x="824" y="219" font-size="22" font-weight="bold" fill="#112b44">Stays with you</text><text x="824" y="255" font-size="16" fill="#536a80">Not exported</text><text x="42" y="320" font-size="14" fill="#536a80">With both labels, control wins. Each instance chooses its own labels. You can rename the suggestions.</text></g></svg>